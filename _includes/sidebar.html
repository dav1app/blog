{% assign author = site.authors.davi %}
<h5 class="mb-3">Sobre</h5>

<img alt="{{ author.name }}" src="{{ author.avatar }}" class="rounded-circle mb-3" height="80" width="80">

<p>{{ author.bio }}</p>

{% if author.instagram %}<a target="_blank" rel="me noopener" href="{{ author.instagram }}" class="btn btn-outline-dark d-block mb-2"><i class="fab fa-instagram"></i> Instagram</a>{% endif %}
{% if author.threads %}<a target="_blank" rel="me noopener" href="{{ author.threads }}" class="btn btn-outline-dark d-block mb-2"><i class="fab fa-threads"></i> Threads</a>{% endif %}
{% if author.youtube %}<a target="_blank" rel="me noopener" href="{{ author.youtube }}" class="btn btn-outline-dark d-block mb-2"><i class="fab fa-youtube"></i> YouTube</a>{% endif %}
{% if author.site %}<a target="_blank" rel="noopener" href="{{ author.site }}" class="btn btn-outline-dark d-block"><i class="fab fa-github"></i> GitHub</a>{% endif %}
