# Site
title: 'Davi Figueiredo'
name: 'Davi Figueiredo'
description: 'Criei este blog para contar a minha história e ajudar outras pessoas.'
favicon: 'assets/images/favicon.png'

# `url` is the origin (scheme + host); `baseurl` is the subpath the site is
# served from. This site is served from the project-pages path, so baseurl is
# '/blog'. If a custom domain is added later, add a CNAME file and change these
# to that domain with baseurl: '' -- see README.md.
url: 'https://dav1app.github.io'
baseurl: '/blog'

email: 'davi.mello.28@gmail.com'
lang: pt-BR
timezone: America/Sao_Paulo

include: ["_pages"]
permalink: /:title/

# Plugins
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-paginate
  - jekyll-seo-tag

authors:
    davi:
      name:           Davi Figueiredo
      site:           https://github.com/dav1app
      avatar:         https://avatars2.githubusercontent.com/u/3607502?s=460
      bio:            "Gerente de TI e desenvolvedor full-stack, entusiasta da descentralização. Designer, músico e fisiculturista nas horas vagas."
      email:          davi.mello.28@gmail.com
      mastodon:       https://mastodon.social/@davifigueiredo

# jekyll-seo-tag author/social metadata
author: Davi Figueiredo

# Defaults
defaults:

  # all posts
  - scope:
      path: "_posts"
    values:
      layout: post
      author: davi

  # all pages
  - scope:
      path: "_pages"
    values:
      layout: page

# Syntax
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge

# Paginate
paginate: 10
paginate_path: "/page:num/"

# Exclude development files from the built site
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - docker-compose.yml
  - vendor
  - node_modules
